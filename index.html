<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101010">
<title>Xolox AI</title>

<style>
:root {
  --bg: #101010;
  --panel: #171717;
  --panel2: #202020;
  --text: #f4f4f4;
  --muted: #999;
  --border: #303030;
  --accent: #a78bfa;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, Arial, sans-serif;
  height: 100dvh;
  overflow: hidden;
}

button, textarea {
  font: inherit;
}

button {
  cursor: pointer;
  color: inherit;
}

.app {
  display: flex;
  height: 100dvh;
  width: 100%;
}

/* SIDEBAR */

.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: #151515;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 16px;
  gap: 16px;
  transition: transform .25s ease;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -.7px;
}

.logo {
  width: 35px;
  height: 35px;
  border-radius: 12px;
  background: var(--accent);
  color: #111;
  display: grid;
  place-items: center;
  font-weight: 900;
}

.new-chat {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  background: var(--panel2);
  text-align: left;
}

.new-chat:hover,
.history-item:hover {
  background: #292929;
}

.history-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.history {
  display: flex;
  flex-direction: column;
  gap: 5px;
  overflow-y: auto;
  flex: 1;
}

.history-item {
  border: 0;
  background: transparent;
  padding: 11px;
  border-radius: 9px;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
}

.history-item.active {
  background: #292929;
}

.sidebar-bottom {
  border-top: 1px solid var(--border);
  padding-top: 14px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

/* MAIN */

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  position: relative;
}

.header {
  height: 62px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
}

.header-left,
.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-title {
  font-weight: 750;
  font-size: 16px;
}

.status {
  font-size: 11px;
  color: #a5e6a5;
  background: #17301d;
  padding: 5px 8px;
  border-radius: 20px;
}

.icon-btn {
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 10px;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  font-size: 18px;
}

.icon-btn:hover {
  background: #303030;
}

/* CHAT */

.chat {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 24px 18px 35px;
  scroll-behavior: smooth;
}

.messages {
  max-width: 800px;
  width: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 25px;
}

.welcome {
  margin: auto;
  text-align: center;
  max-width: 560px;
  padding: 35px 15px;
}

.welcome-logo {
  width: 65px;
  height: 65px;
  border-radius: 22px;
  background: var(--accent);
  color: #111;
  display: grid;
  place-items: center;
  font-size: 30px;
  font-weight: 900;
  margin: 0 auto 22px;
}

.welcome h1 {
  font-size: clamp(27px, 5vw, 42px);
  margin: 0 0 12px;
  letter-spacing: -1.4px;
}

.welcome p {
  color: var(--muted);
  line-height: 1.7;
  margin: 0;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 28px;
}

.suggestion {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 13px;
  text-align: left;
  font-size: 13px;
}

.suggestion:hover {
  border-color: var(--accent);
}

.message {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 100%;
}

.message.user {
  align-items: flex-end;
}

.message.assistant {
  align-items: flex-start;
}

.role {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.bubble {
  max-width: 100%;
  overflow-wrap: anywhere;
  line-height: 1.75;
  font-size: 15px;
}

.user .bubble {
  background: #292929;
  padding: 12px 16px;
  border-radius: 18px 18px 5px 18px;
  max-width: min(85%, 620px);
}

.assistant .bubble {
  width: 100%;
}

.bubble p {
  margin: 0 0 12px;
}

.bubble p:last-child {
  margin-bottom: 0;
}

.bubble strong {
  font-weight: 800;
  color: #fff;
}

.bubble em {
  font-style: italic;
}

.bubble h1,
.bubble h2,
.bubble h3 {
  line-height: 1.35;
  margin: 20px 0 10px;
}

.bubble h1 { font-size: 24px; }
.bubble h2 { font-size: 21px; }
.bubble h3 { font-size: 18px; }

.bubble ul,
.bubble ol {
  padding-left: 24px;
  margin: 10px 0;
}

.bubble li {
  margin: 5px 0;
}

.bubble blockquote {
  margin: 12px 0;
  border-left: 3px solid var(--accent);
  padding: 5px 13px;
  color: #ccc;
}

.bubble a {
  color: #c4b5fd;
  text-decoration: underline;
}

.bubble code {
  background: #252525;
  border: 1px solid #373737;
  border-radius: 5px;
  padding: 2px 5px;
  font-family: Consolas, monospace;
  font-size: .9em;
}

.bubble pre {
  background: #090909;
  border: 1px solid var(--border);
  padding: 15px;
  border-radius: 12px;
  overflow-x: auto;
  white-space: pre;
}

.bubble pre code {
  padding: 0;
  border: 0;
  background: transparent;
}

/* REPLY ACTIONS */

.actions {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 5px;
  flex-wrap: wrap;
}

.action-btn {
  min-width: 35px;
  height: 34px;
  padding: 0 8px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  font-size: 19px;
  display: inline-grid;
  place-items: center;
  transition: background .15s, color .15s, border-color .15s;
}

.action-btn:hover,
.action-btn.selected {
  background: var(--panel2);
  border-color: var(--border);
  color: white;
}

.action-btn.selected {
  color: var(--accent);
}

.action-btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.action-btn .action-label {
  font-size: 11px;
  margin-left: 4px;
}

.typing {
  display: inline-flex;
  gap: 5px;
  align-items: center;
  padding: 10px 0;
}

.typing span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #aaa;
  animation: bounce .9s infinite ease-in-out;
}

.typing span:nth-child(2) {
  animation-delay: .15s;
}

.typing span:nth-child(3) {
  animation-delay: .3s;
}

@keyframes bounce {
  0%, 60%, 100% {
    transform: translateY(0);
    opacity: .5;
  }
  30% {
    transform: translateY(-6px);
    opacity: 1;
  }
}

/* COMPOSER */

.composer-area {
  flex-shrink: 0;
  padding: 12px 18px max(14px, env(safe-area-inset-bottom));
  background: linear-gradient(transparent, var(--bg) 20%);
}

.composer {
  max-width: 800px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 10px;
  border: 1px solid #383838;
  background: #1c1c1c;
  border-radius: 17px;
}

.composer:focus-within {
  border-color: #666;
}

#prompt {
  flex: 1;
  min-width: 0;
  max-height: 180px;
  resize: none;
  outline: none;
  border: 0;
  background: transparent;
  color: white;
  line-height: 1.6;
  padding: 8px 5px;
}

#prompt::placeholder {
  color: #888;
}

.send-btn {
  flex-shrink: 0;
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: #111;
  font-size: 19px;
  font-weight: 800;
}

.send-btn:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.disclaimer {
  text-align: center;
  color: #777;
  font-size: 11px;
  padding-top: 9px;
}

/* MOBILE */

@media (max-width: 700px) {
  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    height: 100dvh;
    z-index: 10;
    transform: translateX(-105%);
    box-shadow: 15px 0 40px #0006;
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .header {
    padding: 0 12px;
  }

  .chat {
    padding: 18px 14px 25px;
  }

  .composer-area {
    padding-left: 12px;
    padding-right: 12px;
  }

  .suggestions {
    grid-template-columns: 1fr;
  }

  .welcome {
    padding: 20px 4px;
  }

  .bubble {
    font-size: 14px;
  }

  .status {
    display: none;
  }
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">X</div>
      <span>Xolox</span>
    </div>

    <button class="new-chat" id="newChat">＋ New chat</button>

    <div class="history-label">Recent chats</div>
    <div class="history" id="history"></div>

    <div class="sidebar-bottom">
      Xolox AI<br>
      Created for Neeraj Production
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <div class="header-left">
        <button class="icon-btn" id="menuBtn" aria-label="Open menu">☰</button>
        <div class="header-title">Xolox AI</div>
        <span class="status">● Online</span>
      </div>

      <div class="header-right">
        <button class="icon-btn" id="clearBtn" title="New conversation">＋</button>
      </div>
    </header>

    <section class="chat" id="chat">
      <div class="messages" id="messages"></div>
    </section>

    <footer class="composer-area">
      <form class="composer" id="chatForm">
        <textarea
          id="prompt"
          rows="1"
          placeholder="Message Xolox..."
          aria-label="Message Xolox"
          required
        ></textarea>
        <button class="send-btn" id="sendBtn" type="submit" aria-label="Send message">↑</button>
      </form>
      <div class="disclaimer">
        Xolox can make mistakes. Check important information.
      </div>
    </footer>
  </main>
</div>

<script>
const API_URL = "/api/chat";

const $ = id => document.getElementById(id);

const sidebar = $("sidebar");
const chat = $("chat");
const messagesEl = $("messages");
const historyEl = $("history");
const promptEl = $("prompt");
const sendBtn = $("sendBtn");

let chats = [];
let currentChatId = null;
let isSending = false;
let typingToken = 0;

function newId() {
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2, 8);
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

/* Markdown rendering: bold, italic, code, lists, headings and links. */
function renderMarkdown(input) {
  const blocks = [];
  let text = String(input || "").replace(/\r\n/g, "\n");

  text = text.replace(/```([\w-]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const index = blocks.length;
    blocks.push(
      `<pre><code>${escapeHTML(code.replace(/\n$/, ""))}</code></pre>`
    );
    return `\n@@BLOCK${index}@@\n`;
  });

  let html = escapeHTML(text);

  html = html.replace(
    /`([^`\n]+)`/g,
    "<code>$1</code>"
  );

  html = html.replace(
    /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    (_, label, url) => {
      const safeUrl = url.replace(/&amp;/g, "&");
      return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${label}</a>`;
    }
  );

  /* FIX: Proper bold support for **text** and __text__. */
  html = html.replace(
    /\*\*([\s\S]+?)\*\*/g,
    "<strong>$1</strong>"
  );

  html = html.replace(
    /__([\s\S]+?)__/g,
    "<strong>$1</strong>"
  );

  html = html.replace(
    /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
    "<em>$1</em>"
  );

  html = html.replace(
    /(?<!_)_([^_\n]+)_(?!_)/g,
    "<em>$1</em>"
  );

  const lines = html.split("\n");
  const output = [];
  let paragraph = [];
  let listType = null;

  function flushParagraph() {
    if (paragraph.length) {
      output.push(`<p>${paragraph.join("<br>")}</p>`);
      paragraph = [];
    }
  }

  function closeList() {
    if (listType) {
      output.push(`</${listType}>`);
      listType = null;
    }
  }

  for (const line of lines) {
    const trimmed = line.trim();

    const blockMatch = trimmed.match(/^@@BLOCK(\d+)@@$/);

    if (blockMatch) {
      flushParagraph();
      closeList();
      output.push(blocks[Number(blockMatch[1])]);
      continue;
    }

    if (!trimmed) {
      flushParagraph();
      closeList();
      continue;
    }

    const heading = trimmed.match(/^(#{1,3})\s+(.+)$/);

    if (heading) {
      flushParagraph();
      closeList();

      const level = heading[1].length;
      output.push(`<h${level}>${heading[2]}</h${level}>`);
      continue;
    }

    if (trimmed.startsWith("&gt; ")) {
      flushParagraph();
      closeList();
      output.push(`<blockquote>${trimmed.slice(5)}</blockquote>`);
      continue;
    }

    const unordered = trimmed.match(/^[-*]\s+(.+)$/);
    const ordered = trimmed.match(/^\d+\.\s+(.+)$/);

    if (unordered || ordered) {
      flushParagraph();

      const nextType = unordered ? "ul" : "ol";

      if (listType !== nextType) {
        closeList();
        output.push(`<${nextType}>`);
        listType = nextType;
      }

      output.push(`<li>${(unordered || ordered)[1]}</li>`);
      continue;
    }

    closeList();
    paragraph.push(trimmed);
  }

  flushParagraph();
  closeList();

  return output.join("\n").replace(
    /@@BLOCK(\d+)@@/g,
    (_, index) => blocks[Number(index)] || ""
  );
}

function getCurrentChat() {
  return chats.find(item => item.id === currentChatId);
}

function saveChats() {
  try {
    localStorage.setItem("xolox_chats", JSON.stringify(chats));
  } catch (error) {
    console.warn("Could not save chat history:", error);
  }
}

function loadChats() {
  try {
    const saved = JSON.parse(
      localStorage.getItem("xolox_chats") || "[]"
    );

    if (Array.isArray(saved)) {
      chats = saved.filter(item =>
        item &&
        typeof item.id === "string" &&
        Array.isArray(item.messages)
      );
    }
  } catch {
    chats = [];
  }
}

function createChat() {
  const item = {
    id: newId(),
    title: "New chat",
    messages: []
  };

  chats.unshift(item);
  currentChatId = item.id;

  saveChats();
  renderChat();
  renderHistory();
  promptEl.focus();
  closeSidebar();
}

function renderHistory() {
  historyEl.innerHTML = "";

  for (const item of chats) {
    const button = document.createElement("button");

    button.className =
      "history-item" +
      (item.id === currentChatId ? " active" : "");

    button.textContent = item.title || "New chat";
    button.title = item.title || "New chat";

    button.addEventListener("click", () => {
      currentChatId = item.id;
      renderChat();
      renderHistory();
      closeSidebar();
    });

    historyEl.appendChild(button);
  }
}

function renderChat() {
  const item = getCurrentChat();
  messagesEl.innerHTML = "";

  if (!item || item.messages.length === 0) {
    const welcome = document.createElement("div");
    welcome.className = "welcome";

    welcome.innerHTML = `
      <div class="welcome-logo">X</div>
      <h1>Meet Xolox.</h1>
      <p>Your AI assistant. Ask questions, explore ideas, or get help with your work.</p>
      <div class="suggestions">
        <button class="suggestion" data-prompt="Explain artificial intelligence simply.">Explain AI simply</button>
        <button class="suggestion" data-prompt="Give me three creative project ideas.">Creative project ideas</button>
        <button class="suggestion" data-prompt="Help me learn something new today.">Learn something new</button>
        <button class="suggestion" data-prompt="Write a short story with a surprising ending.">Write a short story</button>
      </div>
    `;

    welcome.querySelectorAll("[data-prompt]").forEach(button => {
      button.addEventListener("click", () => {
        promptEl.value = button.dataset.prompt;
        autoResize();
        sendMessage();
      });
    });

    messagesEl.appendChild(welcome);
    return;
  }

  item.messages.forEach((message, index) => {
    appendMessage(message.role, message.content, index, false);
  });

  scrollToBottom();
}

function appendMessage(role, content, index, animate = false) {
  const wrapper = document.createElement("article");
  wrapper.className = `message ${role}`;

  const roleLabel = document.createElement("div");
  roleLabel.className = "role";
  roleLabel.textContent = role === "user" ? "You" : "Xolox";

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  wrapper.append(roleLabel, bubble);
  messagesEl.appendChild(wrapper);

  if (role === "assistant") {
    const actionBar = document.createElement("div");
    actionBar.className = "actions";

    /* LIKE: ♡ */
    const likeBtn = makeAction("Like", "♡", () => {
      const wasSelected = likeBtn.classList.contains("selected");

      likeBtn.classList.toggle("selected", !wasSelected);
      dislikeBtn.classList.remove("selected");

      likeBtn.textContent = likeBtn.classList.contains("selected")
        ? "♥"
        : "♡";
    });

    /* DISLIKE: ✕ */
    const dislikeBtn = makeAction("Dislike", "✕", () => {
      const wasSelected = dislikeBtn.classList.contains("selected");

      dislikeBtn.classList.toggle("selected", !wasSelected);
      likeBtn.classList.remove("selected");
      likeBtn.textContent = "♡";
    });

    /* COPY: ❐ */
    const copyBtn = makeAction("Copy", "❐", async () => {
      try {
        await copyText(content);
        copyBtn.textContent = "✓";
        copyBtn.title = "Copied!";

        setTimeout(() => {
          copyBtn.textContent = "❐";
          copyBtn.title = "Copy";
        }, 1500);
      } catch {
        copyBtn.title = "Copy failed";
      }
    });

    /* REWRITE: ✎ */
    const rewriteBtn = makeAction("Rewrite reply", "✎", () => {
      rewriteReply(index, rewriteBtn);
    });

    /* SHARE: ➔ */
    const shareBtn = makeAction("Share", "➔", async () => {
      const shareData = {
        title: "Xolox AI",
        text: content
      };

      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else {
          await copyText(content);
          shareBtn.textContent = "✓";
          shareBtn.title = "Reply copied to share";

          setTimeout(() => {
            shareBtn.textContent = "➔";
            shareBtn.title = "Share";
          }, 1500);
        }
      } catch (error) {
        if (error.name !== "AbortError") {
          shareBtn.title = "Could not share";
        }
      }
    });

    actionBar.append(
      likeBtn,
      dislikeBtn,
      copyBtn,
      rewriteBtn,
      shareBtn
    );

    wrapper.appendChild(actionBar);
  }

  if (animate && role === "assistant") {
    typewriter(bubble, content);
  } else {
    bubble.innerHTML =
      role === "assistant"
        ? renderMarkdown(content)
        : escapeHTML(content).replace(/\n/g, "<br>");
  }

  return wrapper;
}

function makeAction(title, symbol, callback) {
  const button = document.createElement("button");

  button.type = "button";
  button.className = "action-btn";
  button.title = title;
  button.setAttribute("aria-label", title);
  button.textContent = symbol;

  button.addEventListener("click", callback);

  return button;
}

async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }

  const temporary = document.createElement("textarea");

  temporary.value = text;
  temporary.style.position = "fixed";
  temporary.style.opacity = "0";

  document.body.appendChild(temporary);
  temporary.select();

  const success = document.execCommand("copy");
  temporary.remove();

  if (!success) {
    throw new Error("Copy failed");
  }
}

async function typewriter(element, content) {
  const token = ++typingToken;
  const chunkSize = 5;
  let position = 0;

  element.textContent = "";

  while (position < content.length && token === typingToken) {
    position = Math.min(position + chunkSize, content.length);

    element.innerHTML = renderMarkdown(
      content.slice(0, position
