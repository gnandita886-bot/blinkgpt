
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>BlinkGPT</title>

<style>
:root {
  --bg: #ffffff;
  --panel: #f7f7f8;
  --surface: #ffffff;
  --text: #171717;
  --muted: #777777;
  --border: #e7e7e7;
  --assistant: #f5f5f5;
  --user: #eeeeee;
  --input: #ffffff;
  --shadow: 0 3px 18px rgba(0,0,0,.06);
}

body.dark {
  --bg: #101010;
  --panel: #171717;
  --surface: #1d1d1d;
  --text: #f4f4f4;
  --muted: #a0a0a0;
  --border: #303030;
  --assistant: #202020;
  --user: #292929;
  --input: #1d1d1d;
  --shadow: 0 3px 18px rgba(0,0,0,.25);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  height: 100dvh;
  overflow: hidden;
  transition: background .2s, color .2s;
}

button, textarea, select {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  display: flex;
  height: 100dvh;
  width: 100%;
}

/* Sidebar */

.sidebar {
  width: 260px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 17px;
  transition: transform .25s;
  z-index: 20;
}

.brand-row {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 27px;
}

.logo {
  width: 39px;
  height: 39px;
  background: #000000;
  color: #ffffff;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 24px;
  font-weight: 800;
  flex-shrink: 0;
}

.brand-name {
  font-size: 19px;
  font-weight: 750;
  letter-spacing: -.6px;
}

.new-chat {
  width: 100%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: 11px;
  padding: 12px;
  text-align: left;
  font-weight: 600;
  margin-bottom: 22px;
}

.new-chat:hover,
.history-item:hover,
.setting-btn:hover {
  background: var(--user);
}

.section-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  margin: 0 0 10px 5px;
  text-transform: uppercase;
  letter-spacing: .7px;
}

.history-list {
  overflow-y: auto;
  flex: 1;
}

.history-item {
  padding: 11px;
  border-radius: 9px;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}

.history-item.active {
  background: var(--user);
}

.sidebar-bottom {
  border-top: 1px solid var(--border);
  padding-top: 13px;
}

.credit {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.6;
  text-align: center;
  margin-top: 12px;
}

/* Main area */

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  position: relative;
}

.topbar {
  height: 65px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}

.top-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.mobile-logo {
  display: none;
  align-items: center;
  gap: 9px;
  font-weight: 750;
}

.mobile-logo .logo {
  width: 32px;
  height: 32px;
  font-size: 20px;
  border-radius: 9px;
}

.top-title {
  font-size: 16px;
  font-weight: 650;
}

.top-actions {
  display: flex;
  gap: 9px;
  align-items: center;
}

.icon-btn {
  width: 38px;
  height: 38px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 17px;
}

.icon-btn:hover {
  background: var(--user);
}

.menu-wrap {
  position: relative;
}

.settings-menu {
  position: absolute;
  right: 0;
  top: 47px;
  width: 190px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  border-radius: 12px;
  padding: 8px;
  display: none;
  z-index: 50;
}

.settings-menu.show {
  display: block;
}

.menu-title {
  font-size: 12px;
  color: var(--muted);
  padding: 8px;
}

.setting-btn {
  border: 0;
  width: 100%;
  background: transparent;
  color: var(--text);
  text-align: left;
  padding: 10px;
  border-radius: 8px;
  font-size: 13px;
}

/* Chat */

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 25px 18px 30px;
  scroll-behavior: smooth;
}

.chat-content {
  width: 100%;
  max-width: 790px;
  margin: auto;
}

.welcome {
  min-height: 65%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 30px 12px;
}

.welcome-logo {
  width: 67px;
  height: 67px;
  border-radius: 21px;
  background: #000000;
  color: #ffffff;
  display: grid;
  place-items: center;
  font-size: 43px;
  font-weight: 800;
  margin-bottom: 22px;
}

.welcome h1 {
  font-size: clamp(25px, 5vw, 34px);
  letter-spacing: -1px;
  margin-bottom: 10px;
}

.welcome p {
  color: var(--muted);
  font-size: 14px;
}

.messages {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.message {
  display: flex;
  flex-direction: column;
  max-width: 100%;
}

.message.user {
  align-items: flex-end;
}

.message.assistant {
  align-items: flex-start;
}

.message-bubble {
  max-width: 88%;
  padding: 13px 16px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.75;
  overflow-wrap: anywhere;
}

.user .message-bubble {
  background: var(--user);
  border: 1px solid var(--border);
  border-bottom-right-radius: 5px;
}

.assistant .message-bubble {
  background: var(--assistant);
  border: 1px solid var(--border);
  border-bottom-left-radius: 5px;
}

.message-bubble p {
  margin-bottom: 9px;
}

.message-bubble p:last-child {
  margin-bottom: 0;
}

.message-bubble pre {
  white-space: pre-wrap;
  overflow-x: auto;
  background: var(--panel);
  padding: 12px;
  border-radius: 9px;
  margin: 9px 0;
}

.message-bubble code {
  font-family: Consolas, monospace;
  font-size: 12px;
}

.message-bubble ul,
.message-bubble ol {
  padding-left: 22px;
  margin: 8px 0;
}

.message-actions {
  display: flex;
  gap: 5px;
  margin-top: 7px;
  padding-left: 4px;
}

.action-btn {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 6px;
  font-size: 15px;
  border-radius: 6px;
}

.action-btn:hover {
  background: var(--panel);
  color: var(--text);
}

/* Thinking animation */

.thinking {
  display: flex;
  gap: 5px;
  align-items: center;
  padding: 17px;
}

.thinking span {
  height: 7px;
  width: 7px;
  border-radius: 50%;
  background: var(--muted);
  animation: bounce 1.1s infinite ease-in-out;
}

.thinking span:nth-child(2) {
  animation-delay: .15s;
}

.thinking span:nth-child(3) {
  animation-delay: .3s;
}

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: .5; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* Composer */

.composer-area {
  flex-shrink: 0;
  padding: 12px 18px 17px;
  background: var(--bg);
}

.composer-inner {
  max-width: 790px;
  margin: auto;
}

.composer {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: var(--input);
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 10px 11px 10px 15px;
  box-shadow: var(--shadow);
}

.composer:focus-within {
  border-color: #999999;
}

#messageInput {
  flex: 1;
  min-width: 0;
  max-height: 160px;
  resize: none;
  outline: none;
  border: 0;
  background: transparent;
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  padding: 7px 0;
}

#messageInput::placeholder {
  color: var(--muted);
}

.send-btn {
  width: 39px;
  height: 39px;
  flex-shrink: 0;
  border: 0;
  border-radius: 11px;
  background: #000000;
  color: #ffffff;
  display: grid;
  place-items: center;
  font-size: 19px;
  transition: opacity .2s;
}

.send-btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.send-btn:hover:not(:disabled) {
  background: #222222;
}

.composer-note {
  text-align: center;
  color: var(--muted);
  font-size: 10px;
  margin-top: 10px;
}

.language-select {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

/* Mobile */

.mobile-menu {
  display: none;
}

.sidebar-overlay {
  display: none;
}

@media (max-width: 700px) {
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    transform: translateX(-105%);
    width: 275px;
    box-shadow: var(--shadow);
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .sidebar-overlay.show {
    display: block;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    z-index: 10;
  }

  .mobile-menu {
    display: grid;
  }

  .mobile-logo {
    display: flex;
  }

  .top-title {
    display: none;
  }

  .topbar {
    height: 58px;
    padding: 0 12px;
  }

  .chat-area {
    padding: 17px 12px 20px;
  }

  .message-bubble {
    max-width: 94%;
    font-size: 13px;
  }

  .composer-area {
    padding: 9px 10px 12px;
  }

  .welcome h1 {
    font-size: 27px;
  }
}
</style>
</head>

<body>
<div class="app">

  <div class="sidebar-overlay" id="sidebarOverlay"
       onclick="toggleSidebar()"></div>

  <aside class="sidebar" id="sidebar">

    <div class="brand-row">
      <div class="logo">B</div>
      <div class="brand-name">BlinkGPT</div>
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ &nbsp; New chat
    </button>

    <div class="section-label">Recent chats</div>
    <div class="history-list" id="historyList"></div>

    <div class="sidebar-bottom">
      <button class="setting-btn" onclick="toggleTheme()">
        ◐ &nbsp; Switch theme
      </button>
      <button class="setting-btn" onclick="clearHistory()">
        ✕ &nbsp; Clear history
      </button>

      <div class="credit">
        Created & idea by<br>
        <strong>Neeraj Production</strong>
      </div>
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <div class="top-left">
        <button class="icon-btn mobile-menu"
                onclick="toggleSidebar()">☰</button>

        <div class="mobile-logo">
          <div class="logo">B</div>
          <span>BlinkGPT</span>
        </div>

        <div class="top-title">New conversation</div>
      </div>

      <div class="top-actions">

        <button class="icon-btn" title="New chat"
                onclick="newChat()">＋</button>

        <div class="menu-wrap">
          <button class="icon-btn" title="Settings"
                  onclick="toggleSettings()">⚙</button>

          <div class="settings-menu" id="settingsMenu">
            <div class="menu-title">Appearance</div>
            <button class="setting-btn" onclick="setTheme('light')">
              ☀ &nbsp; White theme
            </button>
            <button class="setting-btn" onclick="setTheme('dark')">
              ☾ &nbsp; Black theme
            </button>
          </div>
        </div>

      </div>
    </header>

    <section class="chat-area" id="chatArea">
      <div class="chat-content">

        <div class="welcome" id="welcome">
          <div class="welcome-logo">B</div>
          <h1>Wanna start new Adv?</h1>
          <p>Ask anything. Let's explore something new.</p>
        </div>

        <div class="messages" id="messages"></div>

      </div>
    </section>

    <footer class="composer-area">
      <div class="composer-inner">

        <div class="composer">
          <textarea
            id="messageInput"
            rows="1"
            placeholder="Message BlinkGPT..."
            aria-label="Message BlinkGPT"></textarea>

          <button class="send-btn" id="sendBtn"
                  onclick="sendMessage()" title="Send">
            ↑
          </button>
        </div>

        <div class="composer-note">Mic is yours</div>
      </div>
    </footer>

  </main>
</div>

<script>
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const messagesEl = document.getElementById("messages");
const welcomeEl = document.getElementById("welcome");
const chatArea = document.getElementById("chatArea");
const historyList = document.getElementById("historyList");

let chats = [];
let currentChatId = null;
let isSending = false;

function createId() {
  return Date.now().toString() +
         Math.random().toString(36).slice(2, 7);
}

function loadChats() {
  try {
    chats = JSON.parse(
      localStorage.getItem("blinkgpt_chats") || "[]"
    );
  } catch {
    chats = [];
  }

  renderHistory();

  const savedTheme = localStorage.getItem("blinkgpt_theme");
  if (savedTheme === "dark") {
    document.body.classList.add("dark");
  }
}

function saveChats() {
  localStorage.setItem("blinkgpt_chats", JSON.stringify(chats));
}

function setTheme(theme) {
  document.body.classList.toggle("dark", theme === "dark");
  localStorage.setItem("blinkgpt_theme", theme);
  document.getElementById("settingsMenu").classList.remove("show");
}

function toggleTheme() {
  setTheme(
    document.body.classList.contains("dark") ? "light" : "dark"
  );
}

function toggleSettings() {
  document.getElementById("settingsMenu")
    .classList.toggle("show");
}

document.addEventListener("click", function(event) {
  const menu = document.getElementById("settingsMenu");
  if (!event.target.closest(".menu-wrap")) {
    menu.classList.remove("show");
  }
});

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("sidebarOverlay").classList.toggle("show");
}

function newChat() {
  currentChatId = null;
  messagesEl.innerHTML = "";
  welcomeEl.style.display = "flex";
  document.querySelector(".top-title").textContent =
    "New conversation";
  input.value = "";
  input.focus();

  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebarOverlay").classList.remove("show");

  renderHistory();
}

function clearHistory() {
  if (!confirm("Clear all saved chat history?")) return;

  chats = [];
  currentChatId = null;
  saveChats();
  newChat();
  renderHistory();
}

function renderHistory() {
  historyList.innerHTML = "";

  chats.slice().reverse().forEach(chat => {
    const item = document.createElement("div");
    item.className = "history-item" +
      (chat.id === currentChatId ? " active" : "");

    item.textContent = chat.title || "New conversation";
    item.onclick = () => openChat(chat.id);

    historyList.appendChild(item);
  });
}

function openChat(id) {
  const chat = chats.find(c => c.id === id);
  if (!chat) return;

  currentChatId = id;
  messagesEl.innerHTML = "";
  welcomeEl.style.display = "none";

  chat.messages.forEach(message => {
    addMessage(message.role, message.content, false);
  });

  document.querySelector(".top-title").textContent = chat.title;
  renderHistory();

  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebarOverlay").classList.remove("show");

  scrollToBottom();
}

function ensureChat(firstMessage) {
  if (currentChatId) {
    return chats.find(c => c.id === currentChatId);
  }

  const chat = {
    id: createId(),
    title: firstMessage.slice(0, 35) || "New conversation",
    messages: []
  };

  chats.push(chat);
  currentChatId = chat.id;

  document.querySelector(".top-title").textContent = chat.title;
  renderHistory();

  return chat;
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

/* Basic Markdown formatting */

function formatMessage(text) {
  let html = escapeHTML(text);

  html = html.replace(/```([\s\S]*?)```/g,
    (_, code) => "<pre><code>" + code + "</code></pre>");

  html = html.replace(/`([^`]+)`/g,
    "<code>$1</code>");

  html = html.replace(/\*\*(.*?)\*\*/g,
    "<strong>$1</strong>");

  html = html.replace(/\*(.*?)\*/g,
    "<em>$1</em>");

  html = html.replace(/^### (.*)$/gm, "<h3>$1</h3>");
  html = html.replace(/^## (.*)$/gm, "<h2>$1</h2>");
  html = html.replace(/^# (.*)$/gm, "<h1>$1</h1>");

  html = html.replace(/^\s*[-*] (.*)$/gm, "<li>$1</li>");
  html = html.replace(/(<li>.*<\/li>)/gs, "<ul>$1</ul>");

  html = html.replace(/\n/g, "<br>");

  return html;
}

function addMessage(role, content, save = true) {
  welcomeEl.style.display = "none";

  const wrapper = document.createElement("div");
  wrapper.className = "message " + role;

  const bubble = document.createElement("div");
  bubble.className = "message-bubble";
  bubble.innerHTML = formatMessage(content);

  wrapper.appendChild(bubble);

  if (role === "assistant") {
    const actions = document.createElement("div");
    actions.className = "message-actions";

    const copy = document.createElement("button");
    copy.className = "action-btn";
    copy.title = "Copy";
    copy.textContent = "▢";
    copy.onclick = () => {
      navigator.clipboard?.writeText(content);
      copy.textContent = "✓";
      setTimeout(() => copy.textContent = "▢", 1200);
    };

    const like = document.createElement("button");
    like.className = "action-btn";
    like.title = "Good response";
    like.textContent = "♡";

    like.onclick = () => {
      like.textContent = "♥";
    };

    const dislike = document.createElement("button");
    dislike.className = "action-btn";
    dislike.title = "Bad response";
    dislike.textContent = "♧";

    dislike.onclick = () => {
      dislike.textContent = "✕";
    };

    actions.append(copy, like, dislike);
    wrapper.appendChild(actions);
  }

  messagesEl.appendChild(wrapper);

  if (save) {
    const chat = ensureChat(content);
    chat.messages.push({ role, content });
    saveChats();
    renderHistory();
  }

  scrollToBottom();
  return wrapper;
}

function showThinking() {
  const wrapper = document.createElement("div");
  wrapper.className = "message assistant";
  wrapper.id = "thinkingMessage";

  wrapper.innerHTML = `
    <div class="message-bubble thinking">
      <span></span><span></span><span></span>
    </div>
  `;

  messagesEl.appendChild(wrapper);
  scrollToBottom();
}

function removeThinking() {
  document.getElementById("thinkingMessage")?.remove();
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    chatArea.scrollTop = chatArea.scrollHeight;
  });
}

function autoResize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
}

input.addEventListener("input", autoResize);

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

async function sendMessage() {
  const message = input.value.trim();

  if (!message || isSending) return;

  isSending = true;
  sendBtn.disabled = true;

  const chat = ensureChat(message);

  addMessage("user", message);

  input.value = "";
  input.style.height = "auto";

  showThinking();

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message,
        history: chat.messages.slice(0, -1)
      })
    });

    if (!response.ok) {
      throw new Error("Server error: " + response.status);
    }

    const data = await response.json();

    let reply =
      data.reply ||
      data.response ||
      data.message ||
      data.text ||
      data.candidates?.[0]?.content?.parts
        ?.map(part => part.text || "")
        .join("") ||
      "";

    if (typeof reply !== "string" || !reply.trim()) {
      throw new Error("The AI returned an empty response.");
    }

    removeThinking();
    addMessage("assistant", reply);

  } catch (error) {
    removeThinking();

    addMessage(
      "assistant",
      "Sorry, I couldn't connect to BlinkGPT right now. Please check your server and API configuration, then try again."
    );

    console.error("BlinkGPT error:", error);

  } finally {
    isSending = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

loadChats();
</script>

</body>
</html>
